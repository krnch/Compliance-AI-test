name: Deploy public frontend to Free Static Web App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate frontend-only package (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --check scripts/prepare-public-site.mjs
      - run: node scripts/prepare-public-site.mjs

  deploy:
    name: Deploy static frontend only (backend deferred)
    needs: validate
    if: github.repository == 'krnch/Compliance-AI-test' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/prepare-public-site.mjs
      - name: Upload prepared frontend only
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PERSONALWEBSITES }}
          action: upload
          app_location: .public-site
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main